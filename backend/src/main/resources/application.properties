spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/timerdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:timeruser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:timerpassword}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true